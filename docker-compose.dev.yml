services:
  ec-cube:
    # 1. EC-CUBE 本体を初回起動時に自動インストール（installer-scripts で fixtures も投入）
    # 2. マウントしたプラグインを tar 化し eccube:plugin:install でインストール
    #    （eccube:composer:require はパッケージ API が必要なため path プラグインでは使えない）
    #    PharData は先頭の "./" エントリで失敗するため、プラグインディレクトリ内で
    #    "./*" を対象に tar 化する（ドットファイル/docker 関連は除外される）
    # 3. プラグインを有効化してから Apache を起動
    #    eccube:plugin:enable は内部でキャッシュ再生成を行うが、その直後の 1 回の
    #    cache:clear だけではプラグインのルーティング（おすすめ管理ページ）と Nav
    #    メニューが確定しない（初回ロードで /admin/plugin/recommend が 404 になる）。
    #    enable とは別パスで cache:clear をもう一度実行すると確定するため、2 回流す。
    entrypoint: >
      /bin/bash -c "
      docker-php-entrypoint ls &&
      ( cd /var/www/plugin && tar czf /tmp/Recommend44.tar.gz
      --exclude='./dockerbuild' --exclude='./docker-compose*'
      --exclude='./var' --exclude='./vendor' --exclude='./node_modules' ./* ) &&
      bin/console eccube:plugin:install --code=Recommend44 --path=/tmp/Recommend44.tar.gz --if-not-exists &&
      bin/console eccube:plugin:enable --code=Recommend44 &&
      bin/console cache:clear &&
      bin/console cache:clear &&
      apache2-foreground
      "
    environment:
      USER_ID: ${UID:-}
      GROUP_ID: ${GID:-}
    volumes:
      - ".:/var/www/plugin:cached"
      # 開発環境(HTTP)でログインできるよう Cookie 設定を上書き
      - "./dockerbuild/dev-framework.yaml:/var/www/html/app/config/eccube/packages/dev/framework.yaml"
